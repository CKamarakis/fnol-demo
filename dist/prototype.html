<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNOL — demo prototype</title>
<!--
  the insurer FNOL demo prototype
  ------------------------
  Single self-contained file. No CDN, no external fonts, no map tiles, no analytics.
  Works with the network disconnected. Everything downstream of the driver is SIMULATED.
  No the TPA API was contacted. See the "What's faked" panel in the System console.

  Built by Chris Kamarakis as an interview artefact for the insurer GmbH.
-->
<style>
/* ===== 00-tokens.css ===== */
/* ============================================================
   0. TOKENS
   ============================================================ */
:root{
  /* Light palette. Built on three colours:
       #2A453D  deep green  — primary action, ink, structure
       #F1F5F9  slate-50    — page ground
       #EE6B54  coral       — emergency and alerts, used sparingly so it always means "urgent"
     Contrast targets: body text >= 7:1, secondary >= 4.5:1, all controls >= 3:1. */
  --bg:            #F1F5F9;
  --bg-raise:      #ffffff;
  --bg-raise-2:    #e7edf3;
  --bg-sunken:     #dfe7ee;
  --line:          #bccbd7;
  --line-soft:     #dde5ec;
  --ink:           #16241f;   /* 13.9:1 on --bg */
  --ink-2:         #465a53;   /*  7.1:1 on --bg */
  --ink-3:         #5d7168;   /*  4.9:1 on --bg */
  --accent:        #2A453D;   /* deep green — primary action */
  --accent-ink:    #ffffff;
  --accent-soft:   #dbe7e1;
  --ok:            #1f7a5a;
  --ok-soft:       #d8efe5;
  --warn:          #9a6410;
  --warn-soft:     #fbeed5;
  --danger:        #EE6B54;   /* coral — SURFACES ONLY (2.8:1 as text on --bg). Use --danger-deep for text. */
  --danger-ink:    #ffffff;
  --danger-deep:   #b8341c;   /* text-on-light variant, coral fails contrast as ink */
  --danger-soft:   #fde5e0;
  --eas-blue:      #2b6fd4;
  --eas-blue-bg:   #eaf1fd;
  --eas-yellow:    #c99a12;
  --eas-yellow-bg: #fcf6e3;
  --note:          #6b4bb8;   /* design-note annotations */
  --note-soft:     #eae4f7;

  --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
  --tap: 56px;                /* minimum touch target — adrenaline degrades fine motor control */
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-track{background:transparent}



/* ===== 01-chrome.css ===== */
/* ============================================================
   1. DEMO CHROME  —  deliberately NOT product-styled.
   Monospace, hazard-tape edge, muted. The founders must never
   confuse the scaffolding with the thing being scaffolded.
   ============================================================ */
#chrome{
  position:fixed;top:0;left:0;right:0;z-index:400;
  background:#1d322c;
  border-bottom:1px solid #2A453D;
  font-family:var(--mono);font-size:11.5px;
  user-select:none;
}
#chrome::before{
  content:"";display:block;height:3px;
  background:repeating-linear-gradient(135deg,#2A453D 0 8px,#EE6B54 8px 16px);
}
.chrome-row{display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap}
.chrome-row + .chrome-row{border-top:1px solid #2a453d}
.chrome-tag{
  color:#5d6b7d;letter-spacing:.14em;text-transform:uppercase;
  font-size:9.5px;padding-right:4px;white-space:nowrap;flex:none;
}
.chrome-brand{color:#8fa3b8;font-weight:600;letter-spacing:.04em}
.chrome-brand b{color:var(--accent)}
.chrome-sep{width:1px;align-self:stretch;background:#c8d4de;margin:0 2px}
.chrome-spacer{flex:1}
.seg{display:flex;background:#e7edf3;border:1px solid #c8d4de;border-radius:7px;overflow:hidden}
.seg button{
  padding:6px 11px;color:#64786f;font-family:var(--mono);font-size:11.5px;
  border-right:1px solid #1a222c;white-space:nowrap;transition:background .12s,color .12s;
}
.seg button:last-child{border-right:none}
.seg button:hover{background:#eef3f7;color:#b9c8d8}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04121f;font-weight:700}
.tog{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;
  background:#e7edf3;border:1px solid #c8d4de;border-radius:7px;
  color:#64786f;font-family:var(--mono);font-size:11.5px;white-space:nowrap;
  transition:all .12s;
}
.tog:hover{border-color:#bccbd7;color:#b9c8d8}
.tog .dot{width:8px;height:8px;border-radius:50%;background:#bccbd6;flex:none;transition:all .15s}
.tog[aria-pressed="true"]{background:var(--danger-soft);border-color:#e0a89c;color:#b8341c}
.tog[aria-pressed="true"] .dot{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.tog.note[aria-pressed="true"]{background:var(--note-soft);border-color:#553b85;color:#d9c1ff}
.tog.note[aria-pressed="true"] .dot{background:var(--note);box-shadow:0 0 8px var(--note)}
.tog.fire{border-color:#3a4a2c;color:#a9c98a}
.tog.fire:hover{background:#e4ece7}
.chrome-btn{
  padding:5px 11px;background:#e7edf3;border:1px solid #c8d4de;border-radius:7px;
  color:#64786f;font-family:var(--mono);font-size:11.5px;transition:all .12s;
}
.chrome-btn:hover{background:#eef3f7;color:#b9c8d8;border-color:#bccbd7}
.chrome-btn.danger:hover{background:var(--danger-soft);border-color:#e0a89c;color:#b8341c}
.chrome-hint{color:#4c5a6b;font-size:10.5px;font-style:italic}



/* ===== 02-stage.css ===== */
/* ============================================================
   2. STAGE
   ============================================================ */
#stage{
  position:fixed;top:var(--chrome-h,88px);left:0;right:0;bottom:0;
  overflow:auto;display:flex;flex-direction:column;
}
.stage-pad{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:26px 20px 60px}

/* --- phone frame --- */
.phone-wrap{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.phone{
  width:390px;height:844px;flex:none;position:relative;
  background:var(--bg);border-radius:44px;
  border:1px solid #2a3543;
  box-shadow:0 0 0 9px #dbe2e9, 0 0 0 10px #2b3543, 0 24px 56px -24px #2a453d40;
  overflow:hidden;display:flex;flex-direction:column;
}
.phone-notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:126px;height:27px;background:#e7edf3;border-radius:0 0 16px 16px;z-index:60;
}
.status-bar{
  flex:none;height:44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 5px;font-size:12.5px;font-weight:600;color:var(--ink-2);z-index:55;
}
.status-bar .sb-right{display:flex;align-items:center;gap:5px}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.home-ind{flex:none;height:22px;display:flex;align-items:center;justify-content:center}
.home-ind::after{content:"";width:134px;height:5px;border-radius:3px;background:#b3c2cc}

.phone-caption{
  width:390px;margin-top:14px;text-align:center;color:var(--ink-3);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
}

/* --- desktop / console frame --- */
.deskframe{
  width:100%;max-width:1180px;background:var(--bg-raise);
  border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:0 24px 60px -24px #000;
  display:flex;flex-direction:column;min-height:700px;
}
.desk-bar{
  flex:none;display:flex;align-items:center;gap:9px;padding:11px 16px;
  background:var(--bg-raise-2);border-bottom:1px solid var(--line);
}
.desk-bar .dots{display:flex;gap:6px}
.desk-bar .dots i{width:11px;height:11px;border-radius:50%;background:#bccbd6;display:block}
.desk-title{font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.desk-body{flex:1;padding:24px 26px 40px;overflow:auto}



/* ===== 03-driver.css ===== */
/* ============================================================
   3. DRIVER UI PRIMITIVES
   ============================================================ */
.pad{padding:0 20px}
.h1{font-size:29px;line-height:1.14;font-weight:700;letter-spacing:-.022em;margin:0}
.h2{font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:0}
.h3{font-size:15.5px;font-weight:700;margin:0}
.sub{color:var(--ink-2);font-size:15px;margin:8px 0 0}
.tiny{font-size:12.5px;color:var(--ink-3);margin:0}
.dim{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.sp8{height:8px}.sp12{height:12px}.sp16{height:16px}.sp20{height:20px}.sp28{height:28px}.sp40{height:40px}

/* buttons — all >=56px, primaries live in the bottom third */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:var(--tap);padding:15px 18px;
  border-radius:var(--r-md);font-size:17px;font-weight:650;letter-spacing:-.01em;
  border:1px solid transparent;transition:transform .07s, filter .12s, background .12s;
  text-align:center;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 22px -8px #2A453D88}
.btn-primary:hover{filter:brightness(1.07)}
.btn-secondary{background:var(--bg-raise-2);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{background:#dbe7e1}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--bg-raise);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 6px 22px -8px #EE6B5488}
.btn-quiet{background:transparent;color:var(--ink-3);min-height:48px;font-size:15px;font-weight:600}
.btn-quiet:hover{color:var(--ink-2)}
.btn-lg{min-height:66px;font-size:18.5px}
.btn-sm{min-height:44px;font-size:14px;padding:10px 14px;border-radius:10px;width:auto}
.btn .kbd{font-family:var(--mono);font-size:12px;opacity:.6}

/* sticky action dock — keeps primary actions in the thumb zone */
.dock{
  flex:none;padding:14px 20px 16px;
  background:linear-gradient(to top,var(--bg) 62%,#F1F5F9e0 84%,transparent);
  border-top:1px solid transparent;
}
.dock .btn + .btn{margin-top:9px}

/* cards */
.card{background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.card-quiet{background:var(--bg-raise);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px}

/* field rows — the "confirm, don't type" pattern */
.frow{
  display:flex;align-items:center;gap:13px;width:100%;
  min-height:var(--tap);padding:13px 15px;
  background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md);
  text-align:left;transition:border-color .12s,background .12s;
}
.frow:hover{border-color:#bccbd7}
.frow + .frow{margin-top:9px}
.frow-ic{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--ink-3)}
.frow-body{flex:1;min-width:0}
.frow-label{font-size:12px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;font-weight:650}
.frow-value{font-size:16.5px;font-weight:620;margin-top:2px;overflow-wrap:anywhere}
.frow-value.empty{color:var(--ink-3);font-weight:500}
.frow-right{flex:none;display:flex;align-items:center;gap:8px}
.frow.confirmed{border-color:#d8efe5;background:linear-gradient(90deg,#0d2f2610,#ffffff00)}
.frow.confirmed .tick{color:var(--ok)}
.frow.pending{border-color:#3a3a1e}
.chip-pre{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2.5px 6px;font-weight:700;
}

/* choice buttons */
.choice{
  display:flex;align-items:center;gap:12px;width:100%;min-height:var(--tap);
  padding:15px 16px;background:var(--bg-raise);border:1.5px solid var(--line);
  border-radius:var(--r-md);text-align:left;font-size:16.5px;font-weight:600;
  transition:all .12s;
}
.choice + .choice{margin-top:10px}
.choice:hover{border-color:#a9bcc9;background:var(--bg-raise-2)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:#dbe7e1}
.choice .cbox{
  flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;transition:all .12s;
}
.choice[aria-pressed="true"] .cbox{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice .cbox.round{border-radius:50%}
.choice-sub{display:block;font-size:13px;font-weight:500;color:var(--ink-3);margin-top:2px}

/* two-up */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .choice{margin-top:0}

/* inputs */
.inp{
  width:100%;min-height:var(--tap);padding:14px 15px;font-size:17px;font-weight:600;
  background:var(--bg-sunken);border:1.5px solid var(--line);border-radius:var(--r-md);
  color:var(--ink);transition:border-color .12s;
}
.inp::placeholder{color:#4a5768;font-weight:500}
.inp:focus{border-color:var(--accent);outline:none}
.inp-wrap{position:relative}
.inp-wrap .mic{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-3);background:var(--bg-raise);
}
.inp-wrap .mic:hover{color:var(--accent);background:var(--accent-soft)}
.inp-wrap.has-mic .inp{padding-right:60px}
.lbl{display:block;font-size:13px;font-weight:650;color:var(--ink-2);margin:0 0 8px}
.plate-inp{
  font-family:var(--mono);font-size:26px;letter-spacing:.14em;text-align:center;
  text-transform:uppercase;font-weight:700;min-height:72px;
}

/* disabled-on-purpose field (Art. 9) */
.blocked-field{
  background:#ffffff;border:1.5px dashed #bccbd7;border-radius:var(--r-md);
  padding:14px 15px;color:#4d5a6a;
}
.blocked-field .bf-label{font-size:13px;font-weight:650;color:#5b6a7c}
.blocked-field .bf-fake{
  height:44px;margin-top:8px;border-radius:9px;background:#ffffff;border:1px solid #bccbd7;
  display:flex;align-items:center;padding:0 12px;color:#3d4856;font-size:15px;font-style:italic;
}
.blocked-field .bf-why{
  display:flex;gap:8px;margin-top:11px;font-size:12.5px;line-height:1.42;color:#7b8a9c;
}
.blocked-field .bf-why svg{flex:none;margin-top:1px;color:var(--warn)}

/* banners */
.banner{
  display:flex;align-items:flex-start;gap:11px;padding:12px 15px;
  font-size:13.5px;line-height:1.4;font-weight:600;
}
.banner svg{flex:none;margin-top:1px}
.banner-offline{background:var(--warn-soft);color:#7d5008;border-bottom:1px solid #e8d3a4}
.banner-saved{background:var(--ok-soft);color:#9df0cd}

/* the persistent 112 button — above the fold on every screen */
.emg-rail{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:8px 14px;margin:0;
  background:linear-gradient(90deg,#fde5e0,#1a0e10);
  border-bottom:1px solid #4a1c1c;
}
.emg-rail .emg-btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;min-height:46px;padding:8px 15px;
  background:var(--danger);color:#fff;border-radius:11px;font-weight:800;font-size:16px;
  letter-spacing:.02em;box-shadow:0 3px 14px -4px #EE6B54cc;
}
.emg-rail .emg-btn:hover{filter:brightness(1.1)}
.emg-rail .emg-btn > span{display:flex;align-items:center;justify-content:center;flex:none;line-height:0}
.emg-rail .emg-btn svg{display:block;width:19px;height:19px}
.emg-rail .emg-txt{font-size:12px;color:#b8341c;line-height:1.3;font-weight:600}

/* any icon inside a button is a flex item, never a baseline-aligned inline box */
.btn > span, .nav-back > span{display:inline-flex;align-items:center;justify-content:center;line-height:0}
.btn svg, .nav-back svg{display:block}

/* back bar */
.nav-bar{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 12px 6px 6px;background:var(--bg-raise);
  border-bottom:1px solid var(--line-soft);
}
.nav-back{
  display:flex;align-items:center;gap:4px;
  min-height:40px;padding:8px 12px 8px 8px;
  color:var(--ink-2);background:transparent;border-radius:10px;
  font-family:var(--sans);font-size:14.5px;font-weight:600;cursor:pointer;
}
.nav-back:hover{background:var(--bg-raise-2);color:var(--ink)}
.nav-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-back .nav-chev{display:flex}
.nav-back .nav-chev svg{width:17px;height:17px}
.nav-saved{font-size:11.5px;color:var(--ink-3);padding-right:6px}

/* map — full width of the phone pane, edge to edge */
.map-bleed{
  margin:0 -20px;overflow:hidden;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  line-height:0;
}
.map-bleed svg{width:100%;height:auto;display:block}

/* language dropdown */
.lang-wrap{position:relative;display:inline-flex;align-items:center;flex:none}
.lang-wrap .lang-chev{position:absolute;right:9px;pointer-events:none;color:var(--ink-3);display:flex}
.lang-wrap .lang-chev svg{width:14px;height:14px}
.lang-sel{
  appearance:none;-webkit-appearance:none;
  min-height:38px;padding:7px 30px 7px 12px;
  background:var(--bg-raise-2);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;
  font-family:var(--sans);font-size:13.5px;font-weight:650;cursor:pointer;
}
.lang-sel:hover{border-color:var(--accent);filter:brightness(1.08)}
.lang-sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* timer — demo instrument, not product UI */
.timer-rail .timer-tag{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--accent-ink);background:var(--accent);
  padding:2px 5px;border-radius:4px;flex:none;
}
.timer-rail.idle .idle-val{font-size:11.5px;color:var(--ink-3);font-weight:600;font-family:var(--sans)}
.timer-rail{
  flex:none;display:flex;align-items:center;gap:10px;padding:8px 18px;
  background:var(--bg-sunken);border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-size:12px;
}
.timer-val{font-size:16px;font-weight:700;color:var(--ok);letter-spacing:.02em;min-width:56px}
.timer-val.warn{color:var(--warn)}
.timer-val.over{color:var(--danger-deep)}
.timer-bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--ok);transition:width .3s linear,background .3s}
.timer-lbl{color:var(--ink-3);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.timer-rail.stopped .timer-val{color:var(--ink-2)}

/* step header */
.step-head{flex:none;padding:14px 20px 0}
.step-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.step-count{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase}
.crumb{display:flex;gap:4px;align-items:center}
.crumb i{width:18px;height:3px;border-radius:2px;background:var(--line);display:block;transition:background .2s}
.crumb i.on{background:var(--accent)}
.crumb i.done{background:var(--ok)}

/* perishability list */
.perish-item{
  display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;min-height:var(--tap);
  background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md);text-align:left;
}
.perish-item + .perish-item{margin-top:9px}
.perish-item:hover{border-color:#bccbd7}
.perish-item.done{opacity:.62;border-color:var(--line-soft)}
.perish-item.done .pi-title{text-decoration:line-through;text-decoration-color:#4a5768}
.perish-item.skipped{opacity:.5}
.pi-clock{flex:none;width:34px;text-align:center}
.pi-body{flex:1;min-width:0}
.pi-title{font-size:16px;font-weight:650}
.pi-window{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:5px}
.pi-window b{color:var(--warn);font-weight:700}
.pi-window.gone b{color:var(--danger-deep)}
.pi-window.cool b{color:var(--ink-2)}

/* reference screen */
.ref-hero{
  background:linear-gradient(160deg,#12314e,#0e1a26);
  border:1px solid #c3d6cd;border-radius:var(--r-lg);padding:22px 18px;text-align:center;
  box-shadow:0 0 50px -18px #2A453D55;
}
.ref-code{
  font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:.045em;
  color:#eaf3ff;margin:12px 0 4px;overflow-wrap:anywhere;
}
.ref-stamp{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 13px;
  border:1px dashed #3d6d9e;border-radius:99px;font-size:11.5px;color:#a7cdf2;
  font-family:var(--mono);letter-spacing:.02em;
}
.ref-latency{font-family:var(--mono);font-size:11px;color:var(--ok);letter-spacing:.05em}

/* misc chips */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;
  font-size:11.5px;font-weight:700;font-family:var(--mono);letter-spacing:.04em;
  border:1px solid var(--line);color:var(--ink-2);background:var(--bg-raise-2);white-space:nowrap;
}
.chip.ok{background:var(--ok-soft);color:#7fe6bd;border-color:#d8efe5}
.chip.warn{background:var(--warn-soft);color:#7d5008;border-color:#e8d3a4}
.chip.danger{background:var(--danger-soft);color:#b8341c;border-color:#e0a89c}
.chip.info{background:var(--accent-soft);color:#a5cffb;border-color:#c3d6cd}
.chip.note{background:var(--note-soft);color:#5b3aa8;border-color:#4a3670}
.chip.plain{background:transparent}
.chipset{display:flex;flex-wrap:wrap;gap:8px}

/* skip link — non-shaming, one tap, never confirms */
.skip{
  display:block;width:100%;min-height:48px;margin-top:12px;padding:12px;
  color:var(--ink-3);font-size:15px;font-weight:600;text-align:center;border-radius:12px;
}
.skip:hover{color:var(--ink-2);background:var(--bg-raise)}

/* photo slots */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pslot{
  position:relative;aspect-ratio:4/3;border-radius:var(--r-md);overflow:hidden;
  background:var(--bg-sunken);border:1.5px solid var(--line);
  display:flex;flex-direction:column;justify-content:flex-end;text-align:left;transition:all .14s;
}
.pslot:hover{border-color:#a9bcc9}
.pslot.shot{border-color:#d8efe5}
.pslot.skipped{opacity:.45;border-style:dashed}
.pslot .psvg{position:absolute;inset:0;width:100%;height:100%}
.pslot .plabel{
  position:relative;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.25;
  background:linear-gradient(to top,#dfe7eeef,#dfe7ee00);
}
.pslot .pnum{
  position:absolute;top:7px;left:7px;width:21px;height:21px;border-radius:50%;
  background:#F1F5F9cc;border:1px solid var(--line);display:grid;place-items:center;
  font-size:11px;font-family:var(--mono);font-weight:700;color:var(--ink-2);
}
.pslot.shot .pnum{background:var(--ok);border-color:var(--ok);color:#04241a}
.pslot .pflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.pslot.flashing .pflash{animation:flash .42s ease-out}

/* EAS tick grid */
.eas-grid{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.eas-head{
  display:grid;grid-template-columns:44px 1fr 44px;
  background:var(--bg-raise-2);border-bottom:1px solid var(--line);
  font-size:10px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;
}
.eas-head div{padding:7px 4px;font-weight:700}
.eas-head .hA{color:#1b3f7a;background:#dbe7f7}
.eas-head .hB{color:#7d5008;background:#fbeed5}
.eas-row{display:grid;grid-template-columns:44px 1fr 44px;border-top:1px solid var(--line-soft);min-height:52px;align-items:stretch}
.eas-row:first-child{border-top:none}
.eas-row .txt{padding:9px 10px;font-size:13.5px;line-height:1.32;display:flex;align-items:center}
.eas-row .no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:7px;flex:none}
.eas-tick{display:grid;place-items:center;border-right:1px solid var(--line-soft)}
.eas-tick.B{border-right:none;border-left:1px solid var(--line-soft)}
.eas-tick i{
  width:24px;height:24px;border-radius:6px;border:2px solid #bccbd7;display:grid;place-items:center;
  transition:all .12s;
}
.eas-tick.A:hover i{border-color:#5d90d8}
.eas-tick.B:hover i{border-color:#c9a742}
.eas-tick.on.A i{background:var(--eas-blue);border-color:var(--eas-blue);color:#fff}
.eas-tick.on.B i{background:var(--eas-yellow);border-color:var(--eas-yellow);color:#fbeed5}
.eas-count{display:flex;justify-content:space-between;padding:9px 12px;background:var(--bg-raise-2);border-top:1px solid var(--line);font-size:12px;font-family:var(--mono)}

/* sketch canvas */
.sketch-wrap{position:relative;border:1.5px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#eef3f7;touch-action:none}
.sketch-wrap canvas{display:block;width:100%;height:210px;cursor:crosshair}
.sketch-tools{display:flex;gap:8px;margin-top:10px}
.sig-pad{position:relative;border:1.5px solid var(--line);border-radius:var(--r-md);background:#eef3f7;overflow:hidden;touch-action:none}
.sig-pad canvas{display:block;width:100%;height:110px;cursor:crosshair}
.sig-pad .sig-hint{
  position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#3f4c5c;pointer-events:none;
}
.sig-pad.signed .sig-hint{display:none}

/* impact marker */
.impact-wrap{border:1.5px solid var(--line);border-radius:var(--r-md);background:#eef3f7;padding:10px;position:relative}
.impact-wrap svg{display:block;width:100%;height:auto;touch-action:none}

/* success / soft-stop */
.softstop{text-align:center;padding:8px 0}
.softstop .ring{width:78px;height:78px;margin:0 auto 18px}

/* toast */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:600;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
}
.toast{
  background:#ffffff;border:1px solid #bccbd7;color:#16241f;border-radius:12px;
  padding:11px 17px;font-size:13.5px;font-weight:600;box-shadow:0 14px 40px -12px #000;
  display:flex;align-items:center;gap:9px;animation:toastin .22s ease-out;max-width:440px;
}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.ok{border-color:#a9d9c5;background:#e8f7f0;color:#14543d}
.toast.warn{border-color:#e8d3a4;background:#fbeed5;color:#7d5008}
.toast.err{border-color:#e8b3a7;background:#fdeae5;color:#a02c16}



/* ===== 04-design-notes.css ===== */
/* ============================================================
   4. DESIGN NOTES OVERLAY
   ============================================================ */
.dn{
  position:relative;margin:10px 0;padding:11px 13px 11px 14px;
  background:var(--note-soft);border:1px solid #4a3670;border-left:3px solid var(--note);
  border-radius:10px;font-size:12.5px;line-height:1.46;color:#dcc9ff;
}
.dn b{color:#4c2f96;font-weight:750}
.dn .dn-tag{
  display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:#b98bff;margin-bottom:4px;font-weight:700;
}
.dn code{font-family:var(--mono);font-size:11.5px;background:#2a453d1f;padding:1px 4px;border-radius:4px}
body:not(.notes-on) .dn{display:none}
.notes-on .dn-anchor{outline:1px dashed #6a4fa033;outline-offset:3px;border-radius:8px}



/* ===== 05-fleet.css ===== */
/* ============================================================
   5. FLEET VIEW
   ============================================================ */
.fl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.fl-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.kpi .k-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .k-val{font-size:25px;font-weight:750;margin-top:5px;letter-spacing:-.02em}
.kpi .k-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-family:var(--mono)}
.kpi.good .k-val{color:var(--ok)}
.kpi.warn .k-val{color:var(--warn)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:left;padding:9px 12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tbl td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tr:hover td{background:#e7edf3}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-md);overflow-x:auto;background:var(--bg-raise)}
.comp-bar{width:74px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
.comp-bar i{display:block;height:100%;background:var(--accent)}
.comp-bar i.hi{background:var(--ok)}
.comp-bar i.lo{background:var(--warn)}
.linkish{color:var(--accent);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{filter:brightness(1.15)}

.merge-card{background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:14px}
.merge-head{padding:13px 16px;background:var(--bg-raise-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.merge-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.merge-col{padding:14px 16px;border-right:1px solid var(--line-soft);font-size:12.5px}
.merge-col:last-child{border-right:none}
.merge-col.dup{background:#e7edf3}
.merge-col h5{margin:0 0 9px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.merge-col dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-family:var(--mono);font-size:11.5px}
.merge-col dt{color:var(--ink-3)}
.merge-col dd{margin:0;color:var(--ink-2)}
.merge-foot{padding:13px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg-sunken)}
.match-math{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.match-math b{color:var(--ok)}
.match-math b.no{color:var(--warn)}

.chase{display:grid;gap:10px}
.chase-row{display:flex;gap:14px;align-items:flex-start;padding:13px 15px;background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md)}
.chase-row .cr-main{flex:1;min-width:0}
.chase-list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.chase-list li{
  font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;
  background:var(--bg-raise-2);border:1px solid var(--line);color:var(--ink-2);
}
.chase-list li.perish{border-color:#e8d3a4;background:var(--warn-soft);color:#7d5008}

/* section blocks */
.sect{margin-bottom:26px}
.sect-h{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap}
.sect-h h3{font-size:16px;font-weight:700;margin:0}
.sect-h .sect-note{font-size:12.5px;color:var(--ink-3)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{
  padding:10px 15px;font-size:13.5px;font-weight:650;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}



/* ===== 06-system.css ===== */
/* ============================================================
   6. SYSTEM CONSOLE
   ============================================================ */
.sys-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
@media (max-width:980px){.sys-grid{grid-template-columns:1fr}}
.panel{background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 13px;background:var(--bg-raise-2);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
}
.panel-b{padding:12px 13px;max-height:430px;overflow:auto}
.panel-b.tall{max-height:560px}
.panel-b.flush{padding:0}

.log{font-family:var(--mono);font-size:11.5px;line-height:1.5}
.log-row{
  display:grid;grid-template-columns:62px 52px 1fr auto;gap:9px;align-items:baseline;
  padding:6px 4px;border-bottom:1px solid var(--line-soft);
}
.log-row:hover{background:#e7edf3}
.log-t{color:#4e5d6f}
.log-m{font-weight:700}
.log-m.POST{color:#0f5d84}.log-m.PATCH{color:#7d5008}.log-m.GET{color:#15694c}.log-m.HOOK{color:#5b3aa8}.log-m.SYS{color:#4f6157}
.log-p{color:var(--ink-2);overflow-wrap:anywhere}
.log-s{font-weight:700;white-space:nowrap}
.log-s.s2{color:var(--ok)}.log-s.s4{color:var(--warn)}.log-s.s5{color:var(--danger-deep)}.log-s.sq{color:var(--ink-3)}
.log-meta{grid-column:1/-1;color:#4e5d6f;font-size:10.5px;padding-left:2px;overflow-wrap:anywhere}
.log-meta em{color:#64786f;font-style:normal}
.log-body{
  grid-column:1/-1;margin:5px 0 3px;padding:8px 10px;background:var(--bg-sunken);
  border:1px solid var(--line-soft);border-radius:8px;color:#8ba0b5;font-size:10.5px;
  white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto;
}
.log-empty{color:var(--ink-3);font-size:12px;padding:18px 6px;text-align:center;font-family:var(--sans)}

.qrow{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  background:var(--bg-sunken);border:1px solid var(--line-soft);font-family:var(--mono);font-size:11.5px;
}
.qrow + .qrow{margin-top:7px}
.qrow .qn{flex:1;color:var(--ink-2);overflow-wrap:anywhere}
.qrow .qa{color:var(--warn);white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulsing{animation:pulse 1s infinite}

.hookrow{
  display:flex;gap:9px;align-items:baseline;padding:7px 4px;
  border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11.5px;
}
.hookrow .hk{color:#5b3aa8;font-weight:700}
.hookrow .ht{color:#4e5d6f;flex:none}
.hookrow .hp{color:var(--ink-3);font-size:10.5px}

/* state machine */
.sm{display:flex;flex-direction:column;gap:0;font-family:var(--mono);font-size:11.5px}
.sm-node{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line-soft);background:var(--bg-sunken);color:var(--ink-3);
}
.sm-node .sm-dot{width:9px;height:9px;border-radius:50%;background:#bccbd6;flex:none}
.sm-node.done{color:var(--ink-2);border-color:#d8efe5}
.sm-node.done .sm-dot{background:var(--ok)}
.sm-node.cur{color:#dbe7e1;border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sm-node.cur .sm-dot{background:var(--accent);box-shadow:0 0 9px var(--accent)}
.sm-node.blocked{color:#b8341c;border-color:#e0a89c;background:var(--danger-soft)}
.sm-node.blocked .sm-dot{background:var(--danger)}
.sm-arrow{height:12px;margin-left:16px;border-left:1px solid var(--line);width:1px}
.sm-branch{margin-left:22px;font-size:10.5px;color:var(--ink-3);padding:3px 0}

/* faked list */
.faked li{margin-bottom:7px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.faked li b{color:var(--ink)}



/* ===== 07-eas-export.css ===== */
/* ============================================================
   7. EAS EXPORT
   ============================================================ */
.export-shell{max-width:1180px;margin:0 auto}
.eas-doc{
  background:#fff;color:#ffffff;border-radius:10px;overflow:hidden;
  box-shadow:0 24px 60px -20px #000;font-size:11px;line-height:1.35;
}
.eas-doc-head{
  padding:14px 18px;border-bottom:2px solid #ffffff;display:flex;
  align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.eas-doc-head h2{margin:0;font-size:16px;letter-spacing:-.01em}
.eas-doc-head .sub{color:#7d8f9c;font-size:10.5px;margin:3px 0 0}
.eas-fake-stamp{
  border:2px solid #b8341c;color:#b8341c;border-radius:6px;padding:5px 10px;
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;transform:rotate(-1.5deg);text-align:center;line-height:1.35;
}
.eas-cols{display:grid;grid-template-columns:1fr 1.12fr 1fr}
.eas-col{padding:12px 14px}
.eas-col.A{background:var(--eas-blue-bg);border-right:1px solid #b9c6d6}
.eas-col.B{background:var(--eas-yellow-bg);border-left:1px solid #d6c48a}
.eas-col.M{background:#fff}
.eas-col h4{
  margin:0 0 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding-bottom:5px;border-bottom:1px solid currentColor;
}
.eas-col.A h4{color:var(--eas-blue)}
.eas-col.B h4{color:#96700a}
.eas-col.M h4{color:#ffffff}
.eas-f{margin-bottom:8px}
.eas-f .fl{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:#64786f;font-weight:700}
.eas-f .fv{font-size:11.5px;font-weight:600;border-bottom:1px dotted #9aa7b3;padding:2px 0 1px;min-height:17px;overflow-wrap:anywhere}
.eas-f .fv.empty{color:#546b62;font-style:italic;font-weight:400}
.eas-mid-tbl{width:100%;border-collapse:collapse;font-size:9.5px}
.eas-mid-tbl td{padding:3px 4px;border-bottom:1px solid #e3e8ee;vertical-align:middle}
.eas-mid-tbl td.n{width:15px;color:#8b98a4;font-family:var(--mono);font-size:8.5px;text-align:center}
.eas-mid-tbl td.b{width:20px}
.eas-box{
  width:15px;height:15px;border:1.4px solid #ffffff;border-radius:2px;display:grid;place-items:center;
  font-size:11px;font-weight:800;line-height:1;margin:0 auto;
}
.eas-box.A.on{background:var(--eas-blue);border-color:var(--eas-blue);color:#fff}
.eas-box.B.on{background:var(--eas-yellow);border-color:#a8810c;color:#fbeed5}
.eas-sketchrow{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #ffffff}
.eas-sketchrow > div{padding:11px 14px}
.eas-sketchrow > div:first-child{border-right:1px solid #b9c6d6}
.eas-sketchrow h4{margin:0 0 7px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7d8f9c}
.eas-sigrow{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #ffffff}
.eas-sigrow > div{padding:11px 14px}
.eas-sigrow > div:first-child{border-right:1px solid #b9c6d6;background:var(--eas-blue-bg)}
.eas-sigrow > div:last-child{background:var(--eas-yellow-bg)}
.eas-sig-line{border-bottom:1px solid #ffffff;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.eas-sig-line img{max-height:50px;filter:invert(1)}
.eas-nofault{
  border-top:2px solid #ffffff;padding:9px 14px;background:#f4f7fa;
  font-size:9.5px;color:#3d4a57;display:flex;gap:9px;align-items:flex-start;
}
.eas-nofault b{color:#ffffff}
.eas-imgbox{background:#f6f8fa;border:1px solid #d5dde5;border-radius:5px;height:132px;overflow:hidden}
.eas-imgbox img{width:100%;height:100%;object-fit:contain}
.eas-imgbox.empty{display:grid;place-items:center;color:#546b62;font-style:italic;font-size:10px}

/* JSON + ACORD mapping */
.map-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:980px){.map-wrap{grid-template-columns:1fr}}
pre.json{
  margin:0;padding:14px;background:var(--bg-sunken);border:1px solid var(--line);
  border-radius:var(--r-md);font-family:var(--mono);font-size:11.5px;line-height:1.55;
  color:#a9c2d8;overflow:auto;max-height:620px;white-space:pre;
}
pre.json .k{color:#0f5d84}
pre.json .s{color:#a5efd0}
pre.json .n{color:#7d5008}
pre.json .b{color:#5b3aa8}
table.map{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono)}
table.map th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-3);font-size:10px;letter-spacing:.07em;text-transform:uppercase}
table.map td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.map td.a{color:var(--warn);white-space:nowrap}
table.map td.f{color:var(--ink-2);overflow-wrap:anywhere}
table.map td.e{color:var(--ink-3);font-family:var(--sans);font-size:11.5px}



/* ===== 08-print.css ===== */
/* ============================================================
   8. PRINT — EAS export must print to PDF cleanly
   ============================================================ */
@media print{
  #chrome,#toast,.noprint{display:none!important}
  html,body{overflow:visible!important;background:#fff!important;color:#000!important;height:auto!important}
  #stage{position:static!important;inset:auto!important;overflow:visible!important;display:block!important}
  .stage-pad{padding:0!important;display:block!important}
  .deskframe{max-width:none;border:none;box-shadow:none;background:#fff;min-height:0}
  .desk-bar{display:none}
  .desk-body{padding:0;overflow:visible}
  .eas-doc{box-shadow:none;border-radius:0;border:1px solid #000;font-size:9.5px}
  .export-shell{max-width:none}
  .map-wrap,pre.json,table.map,.sect.noprint{display:none!important}
  @page{size:A4 portrait;margin:10mm}
}

/* small viewport safety for the phone frame */
@media (max-width:460px){
  .phone{width:100%;max-width:390px;height:82vh;border-radius:30px;box-shadow:none;border-color:var(--line)}
  .phone-caption{width:100%}
}
