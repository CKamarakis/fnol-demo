function sysLog(){
  const s=Store.s;
  const grid=el("div",{class:"sys-grid"});

  /* --- left: the API call log --- */
  const logPanel=el("div",{class:"panel"});
  logPanel.append(el("div",{class:"panel-h"},
    el("span",{},"API call log · "+s.log.length+" calls"),
    el("button",{class:"chrome-btn","data-act":"clear-log",style:"font-size:10px;padding:3px 8px"},"clear")));
  const lb=el("div",{class:"panel-b tall"});
  if(!s.log.length){
    lb.append(el("div",{class:"log-empty"},"Nothing yet. Run the driver flow, or flip a failure toggle."));
  }else{
    const log=el("div",{class:"log"});
    s.log.slice().reverse().slice(0,60).forEach(e=>{
      const sc = e.sq ? "sq" : String(e.s).startsWith("2") ? "s2" : String(e.s).startsWith("4") ? "s4" : String(e.s).startsWith("5") ? "s5" : "sq";
      const row=el("div",{class:"log-row"},
        el("span",{class:"log-t",text:e.t}),
        el("span",{class:"log-m "+(e.m||"SYS"),text:e.m||"SYS"}),
        el("span",{class:"log-p",text:e.p}),
        el("span",{class:"log-s "+sc,text:String(e.s)+(e.ms?" · "+e.ms+"ms":"")}));
      if(e.key) row.append(el("span",{class:"log-meta",html:"Idempotency-Key: "+esc(e.key)}));
      if(e.meta) row.append(el("span",{class:"log-meta",html:e.meta}));
      if(e.body) row.append(el("pre",{class:"log-body",text:e.body}));
      log.append(row);
    });
    lb.append(log);
  }
  logPanel.append(lb);
  grid.append(logPanel);

  /* --- right column --- */
  const right=el("div",{style:"display:flex;flex-direction:column;gap:16px"});

  // queue
  const qp=el("div",{class:"panel"});
  qp.append(el("div",{class:"panel-h"},
    el("span",{},"Outbound queue"),
    el("span",{class:s.queue.length?"pulsing":"",style:"color:"+(s.queue.length?"var(--warn)":"var(--ok)"),
      text:s.queue.length? s.queue.length+" waiting":"drained"})));
  const qb=el("div",{class:"panel-b"});
  if(!s.queue.length){
    qb.append(el("div",{class:"log-empty"},"Empty — everything forwarded."));
  }else{
    s.queue.forEach(q=>{
      qb.append(el("div",{class:"qrow"},
        el("span",{style:"color:"+(q.kind==="attachment"?"var(--note)":"var(--warn)"),html:q.kind==="attachment"?I.cam:I.bolt}),
        el("span",{class:"qn"},
          el("div",{},q.method+" "+q.path),
          el("div",{style:"color:#4e5d6f;font-size:10.5px",
            text: q.reason+(q.bytes?" · "+q.bytes:"")+(q.attempts?" · attempt "+(q.attempts+1):"")})),
        el("span",{class:"qa",text: q.nextIn>0 ? "retry in "+q.nextIn+"s" : q.kind==="attachment"?"held":"pending"})
      ));
    });
    qb.append(el("p",{class:"tiny",style:"margin-top:11px;line-height:1.5",
      html:"Field data and attachments are <b style='color:var(--ink-2)'>separate queues</b>. The claim record is a few kilobytes and syncs first; a 4 MB photo must never hold up the reserve."}));
  }
  qp.append(qb);
  right.append(qp);

  // webhooks
  const hp=el("div",{class:"panel"});
  hp.append(el("div",{class:"panel-h"},el("span",{},"Webhook events · "+s.hooks.length)));
  const hb=el("div",{class:"panel-b"});
  if(!s.hooks.length) hb.append(el("div",{class:"log-empty"},"No events fired yet."));
  else s.hooks.slice().reverse().slice(0,24).forEach(h=>{
    hb.append(el("div",{class:"hookrow"},
      el("span",{class:"ht",text:h.t}),
      el("div",{style:"flex:1;min-width:0"},
        el("div",{class:"hk",text:h.name}),
        el("div",{class:"hp",text:Object.entries(h.payload).slice(0,3).map(([k,v])=>k+"="+v).join("  ")}))
    ));
  });
  hp.append(hb);
  right.append(hp);

  // current failure state
  const fp=el("div",{class:"panel"});
  fp.append(el("div",{class:"panel-h"},el("span",{},"Failure theatre · current state")));
  const fb=el("div",{class:"panel-b"});
  const flags=[
    ["TPA down", s.fail.tpa, "TPA forward 502s → queued behind exponential backoff 2s/4s/8s/16s. Driver flow unchanged, byte for byte."],
    ["No signal", s.fail.offline, "Reference generated client-side. Writes queue locally with their idempotency keys. Attachments queue separately."],
    ["Vehicle not on schedule", s.fail.coverage, "Coverage check returns disputed. Incident still accepted, reference still issued, recovery still dispatched. Human review task raised."],
  ];
  flags.forEach(([l,on,why])=>{
    fb.append(el("div",{class:"qrow",style:on?"border-color:#e0a89c;background:#fde5e0":""},
      el("span",{class:"dot",style:"width:8px;height:8px;border-radius:50%;flex:none;background:"+(on?"var(--danger)":"#bccbd6")}),
      el("span",{class:"qn"},
        el("div",{style:"color:"+(on?"#b8341c":"var(--ink-3)")+";font-weight:700"},l+(on?" · ACTIVE":" · off")),
        on ? el("div",{style:"color:#8ba0b5;font-size:10.5px;margin-top:3px;line-height:1.45",text:why}) : null)));
  });
  fb.append(el("div",{class:"sp12"}));
  fb.append(el("button",{class:"btn btn-sm btn-secondary","data-act":"triple-tap",style:"width:100%"},
    "Fire triple-tap submit (3 POSTs, 1 key)"));
  fp.append(fb);
  right.append(fp);

  grid.append(right);

  const box=el("div",{});
  box.append(grid);
  box.append(el("div",{class:"sp20"}));
  box.append(dn("Why this pane exists at all",
    "Every argument in this demo that matters is invisible from the driver's phone — that is the whole point of them. Accept-then-forward looks like <i>nothing happening</i>. Idempotency looks like <i>nothing happening</i>. A coverage dispute that doesn't reject looks like <i>nothing happening</i>. This pane is where “the driver's submission must never depend on the TPA's uptime” stops being a bullet on a slide and becomes something you can watch retry at 2s, 4s and 8s while the driver's screen sits there unchanged."));
  return box;
}

function sysStates(){
  const s=Store.s, inc=s.incident;
  const cur = !inc ? null : (inc.tpa_state==="registered" ? "registered_with_tpa"
    : inc.tpa_state==="queued" ? "queued_for_tpa" : "acknowledged");
  const box=el("div",{});
  const nodes=[
    ["detected","Telematics event detected", "The vehicle fires. No claim exists yet."],
    ["acknowledged","acknowledged", "Accepted, persisted, reference issued. Sub-second. This is the point of no return for the driver's obligation — everything after is the insurer's problem."],
    ["queued_for_tpa","queued_for_tpa", "TPA unreachable. Exponential backoff. Invisible to the driver."],
    ["registered_with_tpa","registered_with_tpa", "The TPA has it. Only now does the TPA claim id exist."],
    ["claim_opened","claim.opened", "Reserve set. Handler assigned."],
  ];
  const sm=el("div",{class:"sm"});
  const order=["detected","acknowledged","queued_for_tpa","registered_with_tpa","claim_opened"];
  const curIdx = cur ? order.indexOf(cur) : (s.startedAt?0:-1);
  nodes.forEach((n,i)=>{
    if(i) sm.append(el("div",{class:"sm-arrow"}));
    const isCur = order[i]===cur;
    const done = curIdx>i && !(order[i]==="queued_for_tpa" && cur!=="queued_for_tpa" && !s.fail.tpa);
    const skip = order[i]==="queued_for_tpa" && cur!=="queued_for_tpa";
    sm.append(el("div",{class:"sm-node "+(isCur?"cur":done&&!skip?"done":"")},
      el("span",{class:"sm-dot"}),
      el("div",{style:"flex:1"},
        el("div",{style:"font-weight:700"},n[1]),
        el("div",{style:"font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.45",text:n[2]})),
      isCur?el("span",{class:"chip info",style:"font-size:9.5px"},"you are here"):null,
      skip&&!isCur?el("span",{class:"chip plain",style:"font-size:9.5px;opacity:.5"},"bypassed"):null
    ));
  });

  const grid=el("div",{class:"sys-grid"});

let scrollMemo={};
function render(){
  const s=Store.s;
  renderChrome();
  const root=$("#root");

  // remember scroll position so re-renders don't jump the driver's screen
  const sc=root.querySelector(".scroll")||root.querySelector(".desk-body");
  const memoKey=s.persona+":"+s.screen+":"+s.fleetTab+":"+s.sysTab;
  if(sc) scrollMemo[memoKey]=sc.scrollTop;

  root.innerHTML="";
  let view;
  if(s.exportOpen) view=renderExport();
  else if(s.persona==="driver") view=renderDriver();
  else if(s.persona==="fleet")  view=renderFleet();
  else                          view=renderSystem();
  root.append(view);

  const nsc=root.querySelector(".scroll")||root.querySelector(".desk-body");
  if(nsc && scrollMemo[memoKey]!=null) nsc.scrollTop=scrollMemo[memoKey];

  mountCanvases();
}

   ================================================================== */
const LS_KEY = "fnol.demo.v1";

function freshDraft(scenId){
  const sc = SCENARIOS[scenId] || SCENARIOS.collision;
  const t  = sc.telematics;
  return {
    // --- Tier 1: the only six fields that block submission ---
    vehicle:      t.vehicle,        vehicleConfirmed:false,
    occurredAt:   t.time,           timeConfirmed:false,
    location:     t.location,       lat:t.lat, lon:t.lon, locationConfirmed:false,
    type:         t.inferred,       typeConfirmed:false,
    injured:      null,             // true | false — the one real question
    drivable:     null,             // true | false — drives the credit-hire clock
    // --- injury detail: presence + band + emergency attended. NOT description. ---
    injurySeverity:null, injuryEmergency:null, injuryCount:null,
    // --- perishable gap-fill ---
    witnessPresent:null, witnessName:"", witnessPhone:"",
    otherPlate:"", otherMake:"", otherDriver:"", otherPhone:"", otherInsurer:"", otherPolicy:"",
    photos:{}, // slot -> {at, skipped}
    easA:[], easB:[], impact:null, sketch:null, sigA:null, sigB:null,
    policeAttended:null, policeRef:"",
    cargoLaden:null, cargoDesc:"", trailer:"", hazardous:null,
    skipped:[],      // ids of things the driver chose to skip — logged, never nagged
    notes:"",
  };
}

const Store = {
  s:{
    persona:"driver",              // driver | fleet | system
    scenario:"collision",
    lang:"en",
    notes:false,                   // design-notes overlay
    fail:{ tpa:false, offline:false, coverage:false },
    screen:"s0",                   // driver flow position
    navStack:[],                   // where the driver came from — every step is reversible
    subScreen:null,
    draft:freshDraft("collision"),
    incident:null,                 // the server-side record once created
    reference:null,
    refLatencyMs:null,
    startedAt:null,                // 90-second timer origin
    stoppedAt:null,
    tick:0,
    log:[],                        // API call log
    hooks:[],                      // webhook events
    queue:[],                      // outbound queue (accept-then-forward)
    incidents:[],                  // fleet list
    mergeGroup:null,               // duplicate simulator result
    exportOpen:false,
    fleetTab:"list",
    sysTab:"log",
    detailOpen:false,
    lastSaved:null,
    easLangCol:"en",
  },
  subs:[],
  sub(f){ this.subs.push(f); },
  set(patch){
    // any screen change pushes the screen we're leaving, so Back always works.
    // NO_HISTORY screens are terminal//destructive resets that must not be re-entered backwards.
    if(patch && patch.screen && patch.screen!==this.s.screen && !patch.__noHist){
      // Every transition is recorded, s0 included — a mistap on the cold open
      // must be as correctable as any other. Returning TO s0 resets the trail.
      if(patch.screen==="s0") this.s.navStack=[];
      else this.s.navStack=[...this.s.navStack, this.s.screen];
    }
    if(patch) delete patch.__noHist;
    Object.assign(this.s,patch); this.save(); this.emit();
  },
  back(){
    const st=[...this.s.navStack];
    const prev=st.pop();
    if(prev==null) return;
    this.s.navStack=st;
    this.set({screen:prev, __noHist:true});
  },
  patchDraft(patch){
    Object.assign(this.s.draft,patch);
    this.s.lastSaved=Date.now();          // persist on every keystroke
    this.save(); this.emit();
  },
  emit(){ this.subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); },
  save(){
    try{
      const {persona,scenario,lang,notes,fail,screen,subScreen,draft,incident,reference,
             refLatencyMs,startedAt,stoppedAt,log,hooks,queue,incidents,mergeGroup,
             fleetTab,sysTab,exportOpen,easLangCol} = this.s;
      localStorage.setItem(LS_KEY, JSON.stringify({
        persona,scenario,lang,notes,fail,screen,subScreen,draft,incident,reference,
        refLatencyMs,startedAt,stoppedAt,
        log:log.slice(-140), hooks:hooks.slice(-80), queue, incidents, mergeGroup,
        fleetTab,sysTab,exportOpen,easLangCol
      }));
    }catch(e){ /* quota or private mode — the demo still runs from memory */ }
  },
  load(){
    try{
      const raw=localStorage.getItem(LS_KEY); if(!raw) return;
      const d=JSON.parse(raw);
      if(d && typeof d==="object") Object.assign(this.s,d);
      if(!this.s.draft) this.s.draft=freshDraft(this.s.scenario);
      // sessions saved before back-navigation existed have no stack
      if(!Array.isArray(this.s.navStack)) this.s.navStack=[];
    }catch(e){}
  },
  reset(keepPersona){
    const persona = keepPersona ? this.s.persona : "driver";
    const scen = this.s.scenario, lang=this.s.lang, notes=this.s.notes;
    localStorage.removeItem(LS_KEY);
    this.s = Object.assign({}, {
      persona, scenario:scen, lang, notes,
      fail:{tpa:false,offline:false,coverage:false},
      screen:"s0", subScreen:null, draft:freshDraft(scen),
      incident:null, reference:null, refLatencyMs:null, startedAt:null, stoppedAt:null, tick:0,
      log:[], hooks:[], queue:[], incidents:[], mergeGroup:null,
      exportOpen:false, fleetTab:"list", sysTab:"log", detailOpen:false, lastSaved:null,
      easLangCol:"en",
    });
    this.save(); this.emit();
  }
};

/* --- log helpers --- */
let logSeq=0;
function logAdd(entry){
  Store.s.log.push(Object.assign({id:++logSeq, t:clockT()}, entry));
  if(Store.s.log.length>200) Store.s.log.splice(0,Store.s.log.length-200);
  Store.save(); Store.emit();
}
function hookFire(name, payload){
  Store.s.hooks.push({id:++logSeq, t:clockT(), name, payload:payload||{}});
  if(Store.s.hooks.length>100) Store.s.hooks.splice(0,Store.s.hooks.length-100);
  logAdd({m:"HOOK", p:"→ webhook  "+name, s:"200", ms:rnd(8,34), body:JSON.stringify(payload||{},null,1)});
}

      meta:"chase message to driver · items ["+items.join(", ")+"] · deep-link resumes the flow with progress intact",
      body:JSON.stringify({channel:"sms+push", incident:v, resume_deeplink:"fnol://fnol/"+v, items},null,1)});
    toast("Chase message queued — deep-link resumes exactly where they stopped.","ok",3400);
  },

  /* ---- export ---- */
  "open-export": v => Store.set({exportOpen:true}),
  "close-export": () => Store.set({exportOpen:false}),
  "print": () => window.print(),
};

/* move to the next perishable item, or the soft stop */
function nextGap(currentId){
  const items=gapItems();
  const idx=items.findIndex(x=>x.id===currentId);
  const rest=items.slice(idx+1).filter(x=>!x.done && !x.skipped);
  if(rest.length) Store.set({screen:rest[0].screen, subScreen:null});
  else ACTIONS["finish-now"]();
}

async function pushDraft(label){
  if(!Store.s.incident) return;
  const d=Store.s.draft;
  await FakeApi.patchIncident(Store.s.incident.id, JSON.parse(JSON.stringify(d)), label);
  const inc=FakeApi._raw.incidents[Store.s.incident.id];
  if(inc) Store.set({incident:FakeApi.project(inc)});
}

/* one delegated click listener */
document.addEventListener("click", e=>{
  const node = e.target.closest("[data-act]");
  if(!node) return;
  if(node.tagName==="SELECT") return;   // native control — let it open; 'change' handles it
  const act = node.getAttribute("data-act");
  const v   = node.getAttribute("data-v");
  const fn  = ACTIONS[act];
  if(!fn) return;
  e.preventDefault();
  try{ fn(v, node); }catch(err){ console.error(act,err); toast("Something broke — see the console.","err"); }
});

/* native selects (language) — 'change', because click is preventDefaulted above */
document.addEventListener("change", e=>{
  const node = e.target.closest && e.target.closest("select[data-act]");
  if(!node) return;
  const fn = ACTIONS[node.getAttribute("data-act")];
  if(!fn) return;
  try{ fn(node.value, node); }catch(err){ console.error(err); }
});

/* free-text fields — persist on EVERY keystroke. Nothing is ever lost. */
document.addEventListener("input", e=>{
  const f=e.target.getAttribute && e.target.getAttribute("data-field");
  if(!f) return;
  let val=e.target.value;
  if(f==="otherPlate") val=val.toUpperCase();
  Store.s.draft[f]=val;
  Store.s.lastSaved=Date.now();
  Store.save();
  // no full re-render on keystroke: it would steal focus and the caret.
  const chip=document.querySelector(".step-meta .chip.ok");
  if(!chip){ /* nothing to update */ }
});

/* ===== src/boot.js ===== */
/* ==================================================================
   §14 BOOT
   ================================================================== */
/* Subscribe the renderer before loading state, so the first emit paints. */
Store.sub(render);
Store.load();
// the timer needs a heartbeat while it's running
setInterval(()=>{
  if(Store.s.persona==="driver" && Store.s.startedAt && !Store.s.stoppedAt
     && ["s1","s0det"].includes(Store.s.screen)){
    const rail=document.querySelector(".timer-rail");
    if(rail){
      const secs=(Date.now()-Store.s.startedAt)/1000;
      const val=rail.querySelector(".timer-val");
      const bar=rail.querySelector(".timer-bar i");
      if(val){ val.textContent=secs.toFixed(1)+"s"; val.className="timer-val "+(secs>90?"over":secs>65?"warn":""); }
      if(bar){ bar.style.width=Math.min(100,secs/90*100)+"%";
        bar.style.background = secs>90?"#EE6B54":secs>65?"#9a6410":"#1f7a5a"; }
    }
  }
},100);

window.addEventListener("resize", ()=>{
  const c=$("#chrome");
  if(c) document.documentElement.style.setProperty("--chrome-h",(c.offsetHeight||88)+"px");
});

render();

// A one-time orientation for whoever opens this cold.
if(!localStorage.getItem(LS_KEY+".seen")){
  try{ localStorage.setItem(LS_KEY+".seen","1"); }catch(e){}
  setTimeout(()=>toast("Start on the Driver persona. Turn on Design notes to read the reasoning inline.","",6000),600);
}

 * concatenates it into a single file, so the import order here is what
 * determines the order of the emitted bundle.
 */
